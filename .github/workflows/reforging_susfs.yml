name: Start Reforge (SUSFS)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP-Clang'
        type: choice
        options:
          - AOSP-Clang
          - Neutron-Clang
# Token bawaan GitHub hanya boleh baca isi repo
permissions:
  contents: read

# Jangan jalankan dua build bersamaan di branch yang sama
concurrency:
  group: reforge-${{ github.ref }}
  cancel-in-progress: false
# Sengaja TIDAK ada secret di level workflow/job.
# Secret Telegram hanya dipasang di step notifikasi (lihat env masing-masing step),
# supaya script pihak ketiga (NoMount, KernelSU) dan proses build tidak bisa membacanya.
env:
  DEVICE_CODENAME: "sweet2"
  # Input dilempar lewat env, bukan di-inline ke script shell (cegah injection)
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  COMPILER: ${{ github.event.inputs.compiler }}
  REF_NAME: ${{ github.ref_name }}
  ACTOR: ${{ github.actor }}
jobs:
  Reforging:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 1
        persist-credentials: false

    - name: ⏰ Prepare timezone
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
    # PERHATIAN: dua step di bawah menjalankan script dari internet (branch bergerak).
    # Idealnya ganti "refs/heads/..." / "main" dengan commit SHA yang sudah kamu cek isinya.
    - name: 🥷 Implant NoMount
      run: curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -

    - name: 📥 Setup KernelSU
      run: curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s main

    - name: 🔍 Verify SUSFS Integration
      shell: bash
      run: |
        set -euo pipefail

        failed=0

        required_files=(
          "fs/susfs.c"
          "include/linux/susfs.h"
          "include/linux/susfs_def.h"
        )

        for file in "${required_files[@]}"; do
          if [[ ! -s "$file" ]]; then
            echo "::error::SUSFS source file is missing: $file"
            failed=1
          else
            echo "✅ Found $file"
          fi
        done

        if ! grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile; then
          echo "::error::fs/Makefile does not build susfs.o through CONFIG_KSU_SUSFS"
          failed=1
        else
          echo "✅ fs/susfs.o is connected to CONFIG_KSU_SUSFS"
        fi

        if [[ ! -e drivers/kernelsu/Kconfig ]]; then
          echo "::error::KernelSU Kconfig was not found at drivers/kernelsu/Kconfig"
          failed=1
        elif ! grep -RqsE --include='Kconfig*' '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' drivers/kernelsu; then
          echo "::error::The installed KernelSU source does not define CONFIG_KSU_SUSFS"
          failed=1
        else
          echo "✅ KernelSU Kconfig defines CONFIG_KSU_SUSFS"
        fi

        if [[ -e drivers/kernelsu ]] && ! grep -RqsE --include='*.c' --include='*.h' 'CMD_SUSFS_SHOW_VERSION|susfs_show_version' drivers/kernelsu; then
          echo "::error::The KernelSU source has no SUSFS version command handler"
          failed=1
        elif [[ -e drivers/kernelsu ]]; then
          echo "✅ KernelSU SUSFS command handler found"
        fi

        if [[ "$failed" -ne 0 ]]; then
          echo "SUSFS integration check failed. The kernel source has SUSFS files, but the installed KernelSU implementation is not fully SUSFS-enabled."
          exit 1
        fi

        echo "✅ SUSFS source and KernelSU integration checks passed"

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          cpio \
          flex \
          bison \
          git \
          python-is-python3 \
          tar \
          aria2 \
          perl \
          wget \
          curl \
          lz4 \
          libssl-dev \
          libelf-dev \
          dwarves \
          zip \
          zstd
    - name: ⚙️ Setup Environment
      shell: bash
      run: |
        set -e
        BUILD_TIME="$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')"
        # Nama branch bisa mengandung "/" atau karakter aneh, rapikan untuk nama file
        SAFE_REF="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        # Label di nama zip: AOSP untuk build AOSP, OEM untuk build MIUI-OOS
        if [[ "$BUILD_TYPE" == "AOSP" ]]; then
          TYPE_TAG="AOSP"
        else
          TYPE_TAG="OEM"
        fi
        {
          echo "BUILD_TIME=$BUILD_TIME"
          echo "BUILD_DATE=$(TZ=Asia/Jakarta date '+%b %d %Y')"
          echo "ARTIFACT_NAME=Reforge-sweet2-${TYPE_TAG}-${SAFE_REF}-${BUILD_TIME}"
        } >> "$GITHUB_ENV"
    - name: 🔧 Setup Compiler
      id: compiler
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p clang

        if [[ "$COMPILER" == "Neutron-Clang" ]]; then

          echo "Using Neutron Clang"
          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest |
            grep "browser_download_url" |
            grep "neutron-clang" |
            head -n 1 |
            cut -d '"' -f 4
          )

          [[ -n "$CLANG_URL" ]] || { echo "❌ URL Neutron Clang tidak ditemukan"; exit 1; }

          echo "Downloading:"
          echo "$CLANG_URL"
          curl -fL "$CLANG_URL" -o neutron-clang.tar.zst
          tar -C clang -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

        else

          echo "Using AOSP Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest |
            grep "browser_download_url" |
            grep -E 'clang-.*\.tar\.gz' |
            head -n 1 |
            cut -d '"' -f 4
          )
          [[ -n "$CLANG_URL" ]] || { echo "❌ URL AOSP Clang tidak ditemukan"; exit 1; }

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -fL "$CLANG_URL" -o clang.tar.gz
          tar -C clang -xf clang.tar.gz
          rm -f clang.tar.gz

        fi

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo
        echo "Compiler:"
        "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
        "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

    - name: 📱 Patch Panel Dimensions
      shell: bash
      run: |
        set -e

        apply_panel_dimensions() {
            local w="$1"
            local h="$2"
            local files=(
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi"
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi"
            )

            for f in "${files[@]}"; do
                if [[ -f "$f" ]]; then

                    echo "Patching $f → ${w}x${h}"
                    sed -i \
                      "s/\(qcom,mdss-pan-physical-width-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${w}/" \
                      "$f"

                    sed -i \
                      "s/\(qcom,mdss-pan-physical-height-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${h}/" \
                      "$f"
                fi
            done
        }
        if [[ "$BUILD_TYPE" == "AOSP" ]]; then
            apply_panel_dimensions 69 156
        else
            apply_panel_dimensions 695 1546
        fi



    - name: 🛠️ Build Kernel
      id: build
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=Ghnkz
        export KBUILD_BUILD_HOST=LineageOS

        export PATH="$CLANG_PATH/bin:$PATH"

        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"
        echo "========================================="
        echo "       Reforge Kernel Compilation"
        echo "========================================="
        echo "Build type : $BUILD_TYPE"
        echo "Compiler   : $COMPILER"
        echo "Date       : $BUILD_DATE"
        echo "Jobs       : $(nproc --all)"
        echo
        clang --version | head -n1
        echo "========================================="

        make O=out ARCH=arm64 vendor/sweet_defconfig

        for symbol in CONFIG_KSU CONFIG_KSU_SUSFS; do
          if ! grep -qx "${symbol}=y" out/.config; then
            echo "::error::${symbol} is not enabled after vendor/sweet_defconfig"
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS)' out/.config || true
            exit 1
          fi
          echo "✅ ${symbol}=y"
        done

        make \
          -j"$(nproc --all)" \
          O=out \
          ARCH=arm64

        if [[ ! -s out/fs/susfs.o ]]; then
          echo "::error::out/fs/susfs.o was not generated; SUSFS was not compiled into the kernel"
          exit 1
        fi

        if [[ ! -s out/vmlinux ]]; then
          echo "::error::out/vmlinux is missing"
          exit 1
        fi

        NM_BIN="$CLANG_PATH/bin/llvm-nm"
        if [[ ! -x "$NM_BIN" ]]; then
          NM_BIN="$(command -v llvm-nm || command -v nm || true)"
        fi

        if [[ -z "$NM_BIN" ]] || ! "$NM_BIN" out/vmlinux 2>/dev/null | grep -Eq '[[:space:]]susfs_'; then
          echo "::error::No SUSFS symbols were found in out/vmlinux"
          exit 1
        fi

        echo "✅ SUSFS object compiled and SUSFS symbols are linked into vmlinux"

        cp out/.config out/sweet_defconfig.txt

    - name: ✅ Verify Kernel Build
      id: verify
      shell: bash
      run: |
        set -e

        KERNEL="out/arch/arm64/boot/Image.gz"
        DTBO="out/arch/arm64/boot/dtbo.img"
        DTB="out/arch/arm64/boot/dtb.img"

        failed=0
        for file in "$KERNEL" "$DTBO" "$DTB"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing: $file"
            failed=1
          else
            echo "✅ Found: $file"
            ls -lh "$file"
          fi
        done

        if [[ "$failed" -ne 0 ]]; then
          echo "Kernel compilation failed."
          exit 1
        fi
    - name: 💾 Upload configs
      uses: actions/upload-artifact@v5
      with:
        name: configs-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt

    - name: 📂 Clone AnyKernel3 & Zip
      shell: bash
      run: |
        set -e

        git clone \
          --depth=1 \
          https://github.com/Naughty-stuff/anykernel3.git \
          AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img

        cd AnyKernel3

        zip -r9 \
          "../${ARTIFACT_NAME}.zip" \
          . \
          -x ".git/*"

    - name: 📤 Upload ZIP Artifact
      uses: actions/upload-artifact@v7
      with:
          name: reforge_${{ matrix.build_type }}-${{ env.SAFE_REF }}-${{ env.BUILD_TIME }}
          path: AnyKernel3/*
